spring:
  application:
    name: ai-agent
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aiagent
    username: root
    password: 123456
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      timeout: 60000
      chat:
        options:
          model: deepseek-r1:1.5b
          temperature: 0.7
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.ai.ollama: DEBUG

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cosmo.aiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
deepseek:
  apikey: ${DEEPSEEK_API_KEY:}
